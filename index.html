<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="script.js"></script>
    <link rel="stylesheet" href="styles.css">
    <title>Card Pairs Game</title>
</head>
<body>
    <div id="header">
        <h1 >Card Pairs Game</h1>
        <span>♔ ♕ ♖ ♗ ♘ ♙</span>
        
    </div>
    <div id="welcome-page">
        <div id = welcome-main>
        <h2>Welcome to the Card Pairs Game!</h2>
        <h2>Test your memory skills by finding all matching pairs of cards.</h2>
        <img src="media/welcomepage.png" alt="welcome" id="welcome-image">

        </div>
    </div>
    
    <div id="main-game">
    <div id="instructions">
    <p>Click on the cards. Try to remember their positions!</p>
    </div>
    

    <div class="cardDivs">
    <div class="card" id="card1" data-index = 0></div>
    <div class="card" id="card2" data-index = 1></div>
    <div class="card" id="card3" data-index = 2></div>
    <div class="card" id="card4" data-index = 3></div>
    <div class="card" id="card5" data-index = 4></div>
    <div class="card" id="card6" data-index = 5></div>
    <div class="card" id="card7" data-index = 6></div>
    <div class="card" id="card8" data-index = 7></div>
    <div class="card" id="card9" data-index = 8></div>
    <div class="card" id="card10" data-index = 9></div>
    <div class="card" id="card11" data-index = 10></div>
    <div class="card" id="card12" data-index = 11></div>
    </div>
    <button id="resetButton">Reset Game</button>
    <footer>
    
    <p>🎮 Developed by Yassine Yahya - 2025</p>
</footer>
</div>

    <div id="winner">
    <p>Congratulations! 
         <br><span>♔ ♕ ♖ ♗ ♘ ♙</span></p>
    </div>
    

</body>
</html>
